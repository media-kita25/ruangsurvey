<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Data Pendaftar | Admin Ruang Survey</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-layout admin-hidden">
<div class="container-fluid">
    <div class="row">
        
        <!-- SIDEBAR (Akan diisi otomatis oleh common.js) -->
        <aside class="col-lg-2 admin-sidebar" id="sidebar"></aside>

        <!-- MAIN CONTENT -->
        <main class="col-lg-10 admin-content">
            <h1 class="fw-bold mb-1">Data Pendaftar</h1>
            <p class="muted mb-4">Daftar pengguna yang telah mendaftar sebelum mengisi survey.</p>

            <div class="data-panel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h5 fw-bold mb-0">Daftar Pengguna</h2>
                    <span class="badge badge-soft bg-secondary" id="totalBadge">Memuat...</span>
                </div>

                <div id="pesanError" class="alert alert-danger d-none"></div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Lengkap</th>
                                <th>Umur</th>
                                <th>Jenis Kelamin</th>
                                <th>Email</th>
                                <th>No. Telepon</th>
                                <th>Alamat</th>
                                <th>Tgl Daftar</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyPendaftar">
                            <tr>
                                <td colspan="8" class="text-center text-muted py-4">
                                    <span class="spinner-border spinner-border-sm me-2"></span> Memuat data...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/common.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async function() {
    
    // 1. PANGGIL FUNGSI ADMIN UNTUK SIDEBAR & PROTEKSI LOGIN
    // Parameter "pendaftar" harus sama dengan ID di array MENU pada common.js
    const session = await RS.requireAdmin('pendaftar');
    
    // Jika belum login, requireAdmin akan otomatis melempar ke halaman login
    if (!session) return; 

    const tbody = document.getElementById('tbodyPendaftar');
    const pesanError = document.getElementById('pesanError');
    const totalBadge = document.getElementById('totalBadge');

    try {
        // 2. GUNAKAN RS.sb (Koneksi Supabase dari common.js)
        const { data, error } = await RS.sb
            .from('pendaftar_survey')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;

        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Belum ada data pendaftar.</td></tr>';
            totalBadge.innerText = '0 Pendaftar';
            return;
        }

        totalBadge.innerText = data.length + ' Pendaftar';

        data.forEach((row, index) => {
            // Menggunakan fungsi RS.fmtDate dari common.js
            let tgl = row.created_at ? RS.fmtDate(row.created_at, true) : '-';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${RS.esc(row.nama || '-')}</strong></td>
                <td>${RS.esc(row.umur || '-')} thn</td>
                <td>${RS.esc(row.jenis_kelamin || '-')}</td>
                <td>${RS.esc(row.email || '-')}</td>
                <td>${RS.esc(row.no_telepon || '-')}</td>
                <td><small>${RS.esc(row.alamat || '-')}</small></td>
                <td><small>${tgl}</small></td>
            `;
            tbody.appendChild(tr);
        });

    } catch (error) {
        console.error("Error Detail:", error);
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger py-4">Gagal memuat data.</td></tr>';
        totalBadge.innerText = 'Error';
        
        pesanError.classList.remove('d-none');
        pesanError.innerHTML = `<strong>Error:</strong> ${RS.esc(error.message)}`;
    }
});
</script>

</body>
</html>
