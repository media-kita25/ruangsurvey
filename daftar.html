<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pendaftaran Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7f9; padding-top: 50px; }
        .card-form { max-width: 600px; margin: auto; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card-header { background: #087f79; color: white; border-radius: 10px 10px 0 0 !important; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card card-form">
        <div class="card-header">
            <h3>Formulir Pendaftaran</h3>
            <p class="mb-0">Isi data diri Anda sebelum mengisi survey</p>
        </div>
        <div class="card-body p-4">
            
            <div id="pesan" class="alert d-none"></div>

            <form id="formDaftar">
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" id="nama" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Umur</label>
                        <input type="number" id="umur" class="form-control" min="10" max="100" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Jenis Kelamin</label>
                        <select id="jenis_kelamin" class="form-select" required>
                            <option value="">-- Pilih --</option>
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nomor Telepon / WhatsApp</label>
                    <input type="text" id="no_telepon" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Alamat Lengkap</label>
                    <textarea id="alamat" class="form-control" rows="3" required></textarea>
                </div>
                
                <button type="submit" class="btn btn-success w-100" style="background-color: #087f79; border: none;">
                    Daftar & Lanjut
                </button>
            </form>
        </div>
    </div>
</div>

<!-- 1. Panggil Library Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 2. Masukkan URL dan Anon Key dari Supabase Anda
    const SUPABASE_URL = 'https://[PROJECT-REF-ANDA].supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Ganti dengan milik Anda
    
    // Inisialisasi Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3. Logika Form Submit
    document.getElementById('formDaftar').addEventListener('submit', async function(e) {
        e.preventDefault(); // Mencegah reload halaman

        const pesanDiv = document.getElementById('pesan');
        const btnSubmit = document.querySelector('button[type="submit"]');
        
        // Ubah tombol jadi loading
        btnSubmit.innerHTML = 'Menyimpan...';
        btnSubmit.disabled = true;

        // Ambil data dari form
        const dataPendaftar = {
            nama: document.getElementById('nama').value,
            umur: parseInt(document.getElementById('umur').value),
            jenis_kelamin: document.getElementById('jenis_kelamin').value,
            email: document.getElementById('email').value,
            no_telepon: document.getElementById('no_telepon').value,
            alamat: document.getElementById('alamat').value
        };

        try {
            // 4. Kirim data ke tabel 'pendaftar_survey' di Supabase
            const { data, error } = await supabaseClient
                .from('pendaftar_survey')
                .insert([dataPendaftar])
                .select(); // .select() untuk mendapatkan data yang baru saja dimasukkan

            if (error) throw error;

            // Jika Berhasil
            pesanDiv.className = 'alert alert-success';
            pesanDiv.innerHTML = 'Pendaftaran berhasil! Mengalihkan ke halaman survey...';
            
            // Simpan ID pendaftar dan Nama ke session browser agar bisa dipakai di survey.html
            if (data && data.length > 0) {
                sessionStorage.setItem('pendaftar_id', data[0].id);
                sessionStorage.setItem('nama_pendaftar', data[0].nama);
            }

            // Pindah ke halaman survey.html setelah 2 detik
            setTimeout(() => {
                window.location.href = 'survey.html';
            }, 2000);

        } catch (error) {
            // Jika Gagal (contoh: email ganda)
            pesanDiv.className = 'alert alert-danger';
            pesanDiv.innerHTML = 'Gagal mendaftar: ' + error.message;
            btnSubmit.innerHTML = 'Daftar & Lanjut';
            btnSubmit.disabled = false;
        }
    });
</script>

</body>
</html>
